name: Windows tests, upstream sync and release
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
      - name: Prepare tested candidate without changing master
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$EVENT_NAME" == pull_request ]]; then
            {
              echo "sha=$EVENT_SHA"
              echo "base=$(git rev-parse HEAD)"
              echo 'changed=false'
            } >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/upstream.py prepare --sync
          fi
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Check both Chinese packs and automation invariants
        run: |
          python3 scripts/localization/verify_zh_hans.py
          python3 -m unittest discover -s scripts/ci/tests -v
          dotnet run --project MissionPlannerTests/Localization/Localization.csproj -c Release
  windows:
    needs: [prepare, validate]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build Release using the independent SDK
        shell: pwsh
        run: ./scripts/localization/build_windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\TitanPlanner-release"
      - name: Run Windows regression tests and both Chinese interfaces
        shell: pwsh
        run: ./scripts/ci/test_windows.ps1 -BuildDirectory "$env:RUNNER_TEMP\TitanPlanner-release" -ResultsDirectory "$env:RUNNER_TEMP\test-results"
      - name: Build Debug
        shell: pwsh
        run: ./scripts/localization/build_windows.ps1 -Configuration Debug -OutputDirectory "$env:RUNNER_TEMP\TitanPlanner-debug"
      - name: Audit resolved dependencies
        shell: pwsh
        run: |
          dotnet list MissionPlanner.csproj package --vulnerable --include-transitive --format json > "$env:RUNNER_TEMP\test-results\dependencies.json"
          if ($LASTEXITCODE) { throw 'Dependency audit failed' }
          python scripts/ci/check_audit.py "$env:RUNNER_TEMP\test-results\dependencies.json"
      - name: Package and round-trip verify Windows ZIP
        shell: pwsh
        env:
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
        run: python scripts/ci/package_windows.py "$env:RUNNER_TEMP\TitanPlanner-release" "$env:RUNNER_TEMP\release" "$env:BUILD_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/
          retention-days: 14
  publish:
    needs: [prepare, validate, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release
          path: release
      - name: Verify artifact provenance, promote tested commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate }}
        run: python3 scripts/ci/publish.py
  review-failure:
    needs: [prepare, validate, windows, publish]
    if: always() && needs.prepare.outputs.changed == 'true' && (needs.validate.result == 'failure' || needs.windows.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - name: Keep failed update in a reviewable PR
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate }}
        run: python3 scripts/ci/upstream.py propose --branch "$CANDIDATE_BRANCH"
